name: APT publication diagnostics
on:
  push:
    branches: ['Mcpasi/package-edition']
    paths: ['.github/workflows/apt-publication-diagnostics.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Edition catalog run whose publication failed before runner startup'
        type: number
        default: 37330895026
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read publication preflight annotations
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.run_id || 37330895026 }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .head_branch == "Mcpasi/package-edition" and .head_repository.full_name == $repo
          ' "$RUNNER_TEMP/run.json" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | endswith("Publish signed APT repository")) | .check_run_url' \
            > "$RUNNER_TEMP/publication-checks.txt"
          test -s "$RUNNER_TEMP/publication-checks.txt"
          while read -r check_url; do
            case "$check_url" in
              "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs/"*) ;;
              *) echo "Unexpected publication check URL" >&2; exit 1;;
            esac
            check_id="${check_url##*/}"
            echo "Publication check $check_id:"
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --jq '.output | {title, summary, text}'
            gh api --paginate "repos/$GITHUB_REPOSITORY/check-runs/$check_id/annotations?per_page=100" \
              --jq '.[] | {annotation_level, message}'
          done < "$RUNNER_TEMP/publication-checks.txt"
