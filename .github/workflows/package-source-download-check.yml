name: Package source download checks
on:
  push:
    branches: ['Mcpasi/package-edition']
    paths: ['.github/workflows/package-source-download-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Find reachable mirrors for the unchanged Savannah archives
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import tempfile
          sources = [
              ("attr", "2.6.0", "d42fa374513180bb48cb11a46696f488240e5124ff1e6ad88b0abff706985612"),
              ("acl", "2.4.0", "73c853c3d44e1f693e5a96a986f1bd19d3d0dac2c7d453e796177774bc4e5f6a"),
          ]
          failures = []
          with tempfile.TemporaryDirectory() as directory:
              for name, version, expected in sources:
                  filename = name + "-" + version + ".tar.gz"
                  urls = [
                      "https://mirrors.kernel.org/savannah/" + name + "/" + filename,
                      "https://download-mirror.savannah.gnu.org/releases/" + name + "/" + filename,
                      "https://distfiles.macports.org/" + name + "/" + filename,
                      "https://deb.debian.org/debian/pool/main/a/" + name + "/" + name + "_" + version + ".orig.tar.gz",
                  ]
                  target = pathlib.Path(directory) / filename
                  for url in urls:
                      result = subprocess.run(["curl", "--fail", "--silent", "--show-error",
                          "--location", "--connect-timeout", "8", "--max-time", "20",
                          "--output", str(target), url])
                      if result.returncode:
                          print(json.dumps({"package": name, "url": url, "curl_exit": result.returncode}), flush=True)
                          continue
                      actual = hashlib.sha256(target.read_bytes()).hexdigest()
                      print(json.dumps({"package": name, "url": url, "sha256": actual, "matches": actual == expected}), flush=True)
                      if actual == expected:
                          break
                  else:
                      failures.append(name)
          if failures:
              raise SystemExit("No verified source mirror: " + ", ".join(failures))
          PY
