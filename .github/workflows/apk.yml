# Debug APK build on a hosted arm64 runner.
#
# scripts/build-debug-apk.sh runs inside a container that reproduces
# the build host: Ubuntu arm64 for every required command, the Termux prefix
# for the pinned LLVM toolchain, and the Android linker so the packaged bionic
# binaries (aapt2 and the Codex app-server) can execute.
# See .github/ci/Dockerfile.
#
# Manual runs default to a preflight-only run, because the
# container is assembled here rather than on a device. container-preflight.sh
# reports everything the environment is still missing in one pass, reading the
# requirements out of the build script so they cannot drift.
name: APK

on:
  push:
    branches:
      - 'Mcpasi/package-edition'
    paths:
      - 'app/**'
      - 'modules/**'
      - 'scripts/**'
      - 'third_party/libcxx/**'
      - 'tests/**'
      - '.github/workflows/apk.yml'
      - '.github/workflows/bootstrap.yml'
      - '.github/ci/bootstrap-*'
      - '.github/ci/BootstrapInstall.java'
      - '.github/ci/Dockerfile'
      - '.github/ci/*build-inputs*'
      - '.github/ci/build-input-cache.py'
      - '.github/ci/container-preflight.sh'
      - '.github/ci/restore-ndk-sysroot.sh'
      - '.github/ci/ndk-29-inputs.tsv'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Only check the container, do not build'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: package-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    uses: ./.github/workflows/bootstrap.yml
    with:
      source_run_id: 37215181811
  apk:
    needs: bootstrap
    name: Debug APK
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      IMAGE: agentcodi-build
      # Full-access runtime needs no seccomp/ptrace overrides.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The mirror is a private backup, so this needs a token with read access
      # to it; the default workflow token cannot reach another repository.
      # Inputs that are still available upstream are fetched without it.
      - uses: actions/download-artifact@v4
        with:
          name: agentcodi-package-bootstrap
          path: output/package-bootstrap

      - name: Select the current edition cache paths
        id: cache-paths
        run: python3 .github/ci/build-input-cache.py

      - name: Restore verified edition inputs
        id: inputs-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: agentcodi-package-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/build-inputs.tsv', '.github/ci/build-input-cache.py') }}

      - name: Restore the pinned build inputs
        env:
          GH_TOKEN: ${{ secrets.AGENTCODI_INPUTS_TOKEN }}
          AGENTCODI_INPUTS_TAG: '0.7.6-preview.1'
        run: .github/ci/fetch-build-inputs.sh

      - name: Verify the build inputs
        run: .github/ci/verify-build-inputs.sh

      - name: Cache the verified edition inputs
        if: steps.inputs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: ${{ steps.inputs-cache.outputs.cache-primary-key }}

      - name: Report the Docker environment
        run: |
          docker version
          df -h /var/lib/docker / | tail -2

      - name: Build the container image
        run: docker build --progress=plain -t "$IMAGE" -f .github/ci/Dockerfile .github/ci

      - name: Check the container against the build requirements
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            "$IMAGE" .github/ci/container-preflight.sh

      - name: Build the debug APK
        if: ${{ !inputs.preflight_only }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e AGENTCODI_CACHE_DIR=/workspace/.cache/android \
            -e AGENTCODI_OUTPUT_DIR=/workspace/output/apk \
            "$IMAGE" ./scripts/build-debug-apk.sh

      # The container runs as root, so anything it wrote is root-owned.
      - name: Hand the outputs back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Collect the APK
        if: ${{ !inputs.preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: agentcodi-package-debug-apk
          path: output/apk/*.apk
          if-no-files-found: error

      - name: Upload final payload and license evidence
        if: ${{ !inputs.preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: agentcodi-package-apk-contract
          path: output/apk/package-apk-contract.json
          if-no-files-found: error
