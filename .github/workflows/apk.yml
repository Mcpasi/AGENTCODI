# Debug APK build on a hosted arm64 runner.
#
# scripts/build-debug-apk.sh runs inside a container that reproduces
# the build host: Ubuntu arm64 for every required command, the Termux prefix
# for the pinned LLVM toolchain, and the Android linker so the packaged bionic
# binaries (aapt2, patchelf, Python, the Codex app-server) can execute.
# See .github/ci/Dockerfile.
#
# Manual runs default to a preflight-only run, because the
# container is assembled here rather than on a device. container-preflight.sh
# reports everything the environment is still missing in one pass, reading the
# requirements out of the build script so they cannot drift.
name: APK

on:
  push:
    branches:
      - main
      - 'CI-TEST*'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Only check the container, do not build'
        type: boolean
        default: true
      source_run_id:
        description: 'Optional: reuse this repository run’s source artifacts; current source receipts must match'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  codex-source:
    if: ${{ (github.event_name == 'push' || !inputs.preflight_only) && !inputs.source_run_id }}
    uses: ./.github/workflows/codex-source.yml

  runtime-source:
    if: ${{ (github.event_name == 'push' || !inputs.preflight_only) && !inputs.source_run_id }}
    uses: ./.github/workflows/runtime-source.yml

  apk:
    needs: [codex-source, runtime-source]
    if: ${{ always() && !failure() && !cancelled() }}
    name: Debug APK
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      IMAGE: agentcodi-build
      # The packaged app-server runs under the project's seccomp/ptrace
      # supervisor, which verifies real syscall interception before executing a
      # command and refuses when it cannot. Docker's default seccomp and
      # AppArmor profiles restrict exactly that, so the container gets the room
      # the sandbox needs — on the device it already runs nested inside the
      # Android app sandbox's own seccomp filter, with no capabilities at all.
      #
      # The profile is not simply unconfined: it allows everything except the
      # Landlock syscalls, which it reports as ENOSYS. The build host has no
      # Landlock, so the sandbox always takes its seccomp/ptrace path there,
      # while a runner kernel does offer it and would send the sandbox down a
      # path the device never exercises.
      SANDBOX_OPTS: >-
        --cap-add=SYS_PTRACE
        --security-opt seccomp=.github/ci/seccomp-no-landlock.json
        --security-opt apparmor=unconfined
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use the checked-out commit timestamp for archive metadata
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Download Codex built from the locked source recipes
        if: ${{ !inputs.preflight_only }}
        uses: actions/download-artifact@v4
        with:
          name: codex-source
          path: output/codex-source
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ inputs.source_run_id && github.token || '' }}

      - name: Download the Android inputs built from the local source recipes
        if: ${{ !inputs.preflight_only }}
        uses: actions/download-artifact@v4
        with:
          name: runtime-source
          path: output/runtime-source
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ inputs.source_run_id && github.token || '' }}

      - name: Verify both complete source receipts against the current recipes
        if: ${{ !inputs.preflight_only }}
        run: |
          tar -xf output/runtime-source/runtime-source.tar -C output/runtime-source
          ./scripts/build-codex-from-source.sh verify
          ./scripts/build-runtime-from-source.sh verify

      - name: Restore the pinned build inputs
        env:
          AGENTCODI_INPUTS_USE_MIRROR: '0'
        run: .github/ci/fetch-build-inputs.sh

      - name: Verify the build inputs
        run: .github/ci/verify-build-inputs.sh

      - name: Report the Docker environment
        run: |
          docker version
          df -h /var/lib/docker / | tail -2

      - name: Build the container image
        run: docker build --progress=plain -t "$IMAGE" -f .github/ci/Dockerfile .github/ci

      - name: Check the container against the build requirements
        run: |
          docker run --rm --network none $SANDBOX_OPTS \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            "$IMAGE" .github/ci/container-preflight.sh

      - name: Build the debug APK
        if: ${{ !inputs.preflight_only }}
        run: |
          docker run --rm --network none $SANDBOX_OPTS \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e AGENTCODI_CACHE_DIR=/workspace/.cache/android \
            -e SOURCE_DATE_EPOCH \
            -e AGENTCODI_CODEX_BUILD_DIR=/workspace/output/codex-source \
            -e AGENTCODI_RUNTIME_BUILD_DIR=/workspace/output/runtime-source \
            -e AGENTCODI_OUTPUT_DIR=/workspace/output/apk \
            -e AGENTCODI_SKIP_DEVICE_LINKER_TESTS=1 \
            -e AGENTCODI_BOOTSTRAP_LAYOUT=flat \
            "$IMAGE" ./scripts/build-debug-apk.sh

      # The container runs as root, so anything it wrote is root-owned.
      - name: Hand the outputs back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Collect the APK
        if: ${{ !inputs.preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: agentcodi-debug-apk
          path: output/apk/*.apk
          if-no-files-found: error
