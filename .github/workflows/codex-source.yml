name: Codex from source

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: Locked Codex and sandbox V8 recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      AGENTCODI_BUILD_JOBS: '2'
      IMAGE: agentcodi-codex-source
    steps:
      - name: Check out AGENTCODI
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Make room while preserving the runner SDK
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the Debian source environment
        run: docker build --progress=plain -t "$IMAGE" -f .github/ci/Dockerfile.runtime-source .github/ci

      - name: Fetch sources and locked Cargo dependencies
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/workspace -v "$ANDROID_HOME":/opt/android-sdk \
            -e AGENTCODI_BUILD_JOBS "$IMAGE" ./scripts/fdroid/prepare.sh codex

      - name: Test the patched host selection before the long V8 build
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/workspace -v "$ANDROID_HOME":/opt/android-sdk \
            -e CARGO_TARGET_DIR=/workspace/.build/codex-install-context-tests \
            "$IMAGE" bash -Eeuo pipefail -c \
            'cd .cache/fdroid/codex-termux/codex-rs; rustup run 1.95.0 cargo test --frozen -p codex-install-context --lib'

      - name: Build both fork recipes without network access
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/workspace -v "$ANDROID_HOME":/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/28.2.13676358 \
            -e AGENTCODI_BUILD_JOBS "$IMAGE" ./scripts/build-codex-from-source.sh build

      - name: Verify the source-built package
        run: ./scripts/build-codex-from-source.sh verify

      - name: Upload only the source-built package and provenance
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-source
          path: |
            output/codex-source/package.tgz
            output/codex-source/source-build.json
          if-no-files-found: error
