name: Community license source research
on:
  push:
    branches: ['Mcpasi/package-edition']
    paths:
      - '.github/workflows/community-license-research.yml'
      - '.github/ci/collect-community-licenses.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DioNanos/codex-termux
          ref: ea762071ec4acbf1531fcc7daf47524836f70a09
          path: legal-source/codex
          persist-credentials: false
      - name: Install the producer's Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rust-docs
      - name: Reuse verified V8 and standard-library legal source material
        uses: actions/download-artifact@v4
        with:
          name: community-dependency-license-research
          run-id: 37451191641
          github-token: ${{ github.token }}
          path: legal-seed
      - name: Collect original license texts and report missing material
        run: python3 .github/ci/collect-community-licenses.py --codex legal-source/codex --seed-v8 legal-seed --output legal-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: community-dependency-license-research
          path: legal-evidence/
          if-no-files-found: error
