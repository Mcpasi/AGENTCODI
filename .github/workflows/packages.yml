name: Package catalog
on:
  push:
    branches: ['Mcpasi/package-edition']
    paths:
      - 'scripts/package-edition/**'
      - '.github/workflows/packages.yml'
      - '.github/workflows/bootstrap.yml'
      - '.github/ci/catalog-*'
      - '.github/ci/bootstrap-*'
      - '.github/ci/BootstrapInstall.java'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Reuse successful same-branch source jobs only with identical build inputs'
        type: number
        default: 0
permissions:
  contents: read
  actions: read
env:
  CATALOG_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.source_run_id) || '37224140220' }}
concurrency:
  group: package-catalog-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    uses: ./.github/workflows/bootstrap.yml
    with:
      source_run_id: 37215181811
  build:
    name: Source build (${{ matrix.group }})
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        group: [python, node, git, ripgrep]
    steps:
      - uses: actions/checkout@v4
      - name: Check reusable source build provenance and inputs
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ env.CATALOG_SOURCE_RUN_ID }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          echo 'reuse=false' >> "$GITHUB_OUTPUT"
          [ "$SOURCE_RUN_ID" -gt 0 ] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json" || exit 0
          jq -e --arg repo "$GITHUB_REPOSITORY" '.head_branch == "Mcpasi/package-edition" and .event == "push" and .head_repository.full_name == $repo' "$RUNNER_TEMP/source-run.json" >/dev/null || exit 0
          source_sha="$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")"
          git fetch --depth=1 origin "$source_sha"
          git diff --quiet "$source_sha" HEAD -- scripts/package-edition/lock.json scripts/package-edition/overlay.json scripts/package-edition/catalog.json scripts/package-edition/prepare.py scripts/package-edition/prepare-catalog.py scripts/package-edition/build-catalog.sh || exit 0
          for attempt in $(seq 1 240); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
            state="$(jq -r --arg name "Source build ($GROUP)" '.jobs[] | select(.name == $name) | .status' "$RUNNER_TEMP/source-jobs.json")"
            [ "$state" = in_progress ] || [ "$state" = queued ] || break
            echo "Waiting for the identical source build ($GROUP), attempt $attempt."
            sleep 45
          done
          jq -e --arg name "Source build ($GROUP)" 'any(.jobs[]; .name == $name and .conclusion == "success")' "$RUNNER_TEMP/source-jobs.json" >/dev/null || exit 0
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" | jq -e --arg name "agentcodi-catalog-$GROUP" 'any(.artifacts[]; .name == $name and .expired == false)' >/dev/null || exit 0
          echo 'reuse=true' >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.reuse.outputs.reuse == 'true'
        with:
          name: agentcodi-catalog-${{ matrix.group }}
          run-id: ${{ env.CATALOG_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package-catalog/input
      - name: Reaudit verified source-built DEBs with current validators
        if: steps.reuse.outputs.reuse == 'true'
        env:
          SOURCE_RUN_ID: ${{ env.CATALOG_SOURCE_RUN_ID }}
          SOURCE_SHA: ${{ steps.reuse.outputs.source_sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/package-catalog"
          (cd "$root/input" && sha256sum -c SHA256SUMS)
          mkdir -p "$root/unpacked"
          tar -C "$root/unpacked" -xf "$root/input/source-built-debs.tar"
          python3 -B scripts/package-edition/audit-catalog.py --debs "$root/unpacked/output" --output "$root/output" --group "${{ matrix.group }}"
          python3 -B scripts/package-edition/collect-bootstrap-sources.py --reuse-from "$root/input" --output "$root/output"
          cp "$root/input/source-built-debs.tar" "$root/output/"
          python3 - "$root/output/source-build.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_commit": os.environ["SOURCE_SHA"],
              "consumer_commit": os.environ["GITHUB_SHA"],
              "recipe_inputs_identical": True}, indent=2) + "\n")
          PY
          (cd "$root/output" && sha256sum source-built-debs.tar source-build.json >> SHA256SUMS)
      - name: Prepare the pinned catalog recipes in fresh storage
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/package-edition/prepare-catalog.py scripts/package-edition/audit-catalog.py
          bash -n scripts/package-edition/build-catalog.sh .github/ci/catalog-smoke.sh
          root="$RUNNER_TEMP/package-catalog"
          mkdir -p "$root/output"
          git init -q "$root/source"
          git -C "$root/source" remote add origin https://github.com/termux/termux-packages.git
          git -C "$root/source" fetch --depth=1 origin "$(jq -r .source.commit scripts/package-edition/lock.json)"
          git -C "$root/source" checkout --detach FETCH_HEAD
          python3 -B scripts/package-edition/prepare-catalog.py --source "$root/source" --output "$root/prepared"
          sudo chown -R 1001:1001 "$root/prepared" "$root/output"
      - name: Build the catalog and all dependencies from sources
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/package-catalog"
          docker run --rm --platform linux/amd64 \
            --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE":/audit:ro \
            -v "$root/prepared":/home/builder/termux-packages \
            -v "$root/output":/catalog \
            "$(jq -r .builder.image scripts/package-edition/lock.json)" \
            bash /audit/scripts/package-edition/build-catalog.sh "${{ matrix.group }}"
      - name: Archive all source-built DEBs and preparation
        if: always() && steps.reuse.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/package-catalog"
          if [ -d "$root/prepared/output" ]; then
            sudo tar -C "$root/prepared" -cf "$root/output/source-built-debs.tar" output
            if [ -f "$root/output/SHA256SUMS" ]; then
              (cd "$root/output" && sha256sum source-built-debs.tar >> SHA256SUMS)
            fi
          fi
          if [ -f "$root/prepared/agentcodi-preparation.json" ]; then
            sudo cp "$root/prepared/agentcodi-preparation.json" "$root/output/"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentcodi-catalog-${{ matrix.group }}
          path: ${{ runner.temp }}/package-catalog/output/
          if-no-files-found: error
  runtime:
    name: Catalog ARM64 Bionic (${{ matrix.group }})
    needs: [bootstrap, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [python, node, git, ripgrep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agentcodi-package-bootstrap
          path: bootstrap
      - uses: actions/download-artifact@v4
        with:
          name: agentcodi-bootstrap-ci-compat
          path: bootstrap/ci-compat
      - uses: actions/download-artifact@v4
        with:
          name: agentcodi-catalog-${{ matrix.group }}
          path: bootstrap/catalog
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify artifacts and install the app bootstrap
        run: |
          set -euo pipefail
          (cd bootstrap && sha256sum -c SHA256SUMS)
          (cd bootstrap/catalog && sha256sum -c SHA256SUMS)
          (cd bootstrap/ci-compat && sha256sum -c SHA256SUMS)
          .github/ci/run-java-tests.sh
          javac -cp "$RUNNER_TEMP/agentcodi-ci-java/classes" -d "$RUNNER_TEMP/agentcodi-ci-java/classes" .github/ci/BootstrapInstall.java
          mkdir -p bootstrap/root
          java -cp "$RUNNER_TEMP/agentcodi-ci-java/classes" BootstrapInstall bootstrap
          cp .github/ci/catalog-smoke.sh bootstrap/smoke.sh
          chmod 755 bootstrap/ci-compat/bootstrap-api29-compat-test
          sudo chown -R 1000:1000 bootstrap
      - name: Install and exercise the actual catalog in Bionic
        run: |
          set -euo pipefail
          docker run --rm --user 1000:1000 \
            --entrypoint /data/data/de.agentcodi.pkg/files/usr/bin/dash \
            -e LD_LIBRARY_PATH=/data/data/de.agentcodi.pkg/files/usr/lib \
            -e LD_PRELOAD=/audit/ci-compat/libagentcodi-ci-api29.so \
            -v "$GITHUB_WORKSPACE/bootstrap":/audit \
            -v "$GITHUB_WORKSPACE/bootstrap/root":/data/data/de.agentcodi.pkg/files \
            termux/termux-docker:aarch64@sha256:e19ea56dd687563849826cbda57da714ae23277ee463e21f39917dbc0a59bab4 \
            /audit/smoke.sh "${{ matrix.group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentcodi-catalog-runtime-${{ matrix.group }}
          path: bootstrap/evidence/
          if-no-files-found: warn
