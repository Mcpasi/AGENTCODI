name: Transfer Package Edition signing secrets

# This one-off workflow stays off main and the original Package Edition branch.
# After adding the transfer token, rerun this branch's failed job in Actions.
on:
  push:
    branches: ['Mcpasi/transfer-package-signing-secrets']
    paths:
      - '.github/workflows/transfer-package-signing-secrets.yml'
      - '.github/ci/transfer-package-signing-*'

permissions: {}

concurrency:
  group: transfer-signing-secrets-to-Mcpasi-AGENTCODI-Package-Edition
  cancel-in-progress: false

jobs:
  transfer:
    name: Copy existing signing secrets to the new repository
    if: github.repository == 'Mcpasi/AGENTCODI' && github.ref == 'refs/heads/Mcpasi/transfer-package-signing-secrets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed transfer code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check transfer-token access before exposing signing secrets
        env:
          GH_TOKEN: ${{ secrets.AGENTCODI_SECRET_TRANSFER_TOKEN }}
        run: python3 -B .github/ci/transfer-package-signing-secrets.py --preflight

      - name: Install pinned encryption dependencies without signing secrets
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/agentcodi-secret-transfer"
          "$RUNNER_TEMP/agentcodi-secret-transfer/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r .github/ci/transfer-package-signing-requirements.txt

      - name: Test byte preservation and error handling with synthetic keys
        run: '"$RUNNER_TEMP/agentcodi-secret-transfer/bin/python" -B .github/ci/transfer-package-signing-tests.py'

      - name: Encrypt and copy the existing signing secrets
        env:
          GH_TOKEN: ${{ secrets.AGENTCODI_SECRET_TRANSFER_TOKEN }}
          AGENTCODI_APT_SIGNING_KEY: ${{ secrets.AGENTCODI_APT_SIGNING_KEY }}
          AGENTCODI_APT_SIGNING_PASSPHRASE: ${{ secrets.AGENTCODI_APT_SIGNING_PASSPHRASE }}
          AGENTCODI_RELEASE_KEYSTORE_BASE64: ${{ secrets.AGENTCODI_RELEASE_KEYSTORE_BASE64 }}
          AGENTCODI_RELEASE_STORE_PASSWORD: ${{ secrets.AGENTCODI_RELEASE_STORE_PASSWORD }}
          AGENTCODI_RELEASE_KEY_PASSWORD: ${{ secrets.AGENTCODI_RELEASE_KEY_PASSWORD }}
          AGENTCODI_RELEASE_KEY_ALIAS: ${{ secrets.AGENTCODI_RELEASE_KEY_ALIAS }}
          AGENTCODI_RELEASE_CERT_SHA256: ${{ secrets.AGENTCODI_RELEASE_CERT_SHA256 }}
        run: '"$RUNNER_TEMP/agentcodi-secret-transfer/bin/python" -B .github/ci/transfer-package-signing-secrets.py --transfer'
