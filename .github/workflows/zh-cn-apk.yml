name: zh-CN APK

on:
  push:
    branches: [main, nono1437-zh-cn-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build zh-CN debug APK
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      IMAGE: agentcodi-zh-cn-build
      OFFICIAL_APK_URL: https://github.com/Mcpasi/AGENTCODI/releases/download/preview-0.7.6/AGENTCODI-0.7.6-preview.1-arm64-v8a-release.apk
      OFFICIAL_APK_SHA256: 62b91245fd8ed0aa38598b8f755695d93648307d69fd861c26549ba624b0cebd
      SANDBOX_OPTS: >-
        --cap-add=SYS_PTRACE
        --security-opt seccomp=.github/ci/seccomp-no-landlock.json
        --security-opt apparmor=unconfined

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check shell syntax and the pinned input manifest
        shell: bash
        run: |
          bash -n scripts/build-debug-apk.sh .github/ci/*.sh
          .github/ci/generate-build-inputs.sh > /tmp/agentcodi-build-inputs.tsv
          diff -u .github/ci/build-inputs.tsv /tmp/agentcodi-build-inputs.tsv

      - name: Reconstruct the pinned Codex package from the official preview APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .cache/android/reconstructed/package/bin
          curl --fail --location --retry 3 --retry-delay 2 \
            -o /tmp/agentcodi-official.apk "$OFFICIAL_APK_URL"
          echo "$OFFICIAL_APK_SHA256  /tmp/agentcodi-official.apk" | sha256sum -c -

          unzip -p /tmp/agentcodi-official.apk \
            lib/arm64-v8a/libcodex.so \
            > .cache/android/reconstructed/package/bin/codex.bin
          unzip -p /tmp/agentcodi-official.apk \
            lib/arm64-v8a/libcodex-codehost.so \
            > .cache/android/reconstructed/package/bin/codex-code-mode-host
          unzip -p /tmp/agentcodi-official.apk \
            assets/third-party/codex/LICENSE \
            > .cache/android/reconstructed/package/LICENSE
          unzip -p /tmp/agentcodi-official.apk \
            assets/third-party/codex/NOTICE \
            > .cache/android/reconstructed/package/NOTICE

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.cache/android/reconstructed/package/bin/codex.bin')
          data = bytearray(path.read_bytes())
          offset = 11073755
          packaged = b'libcodex-codehost.so'
          original = b'codex-code-mode-host'
          assert len(packaged) == len(original)
          actual = bytes(data[offset:offset + len(packaged)])
          if actual != packaged:
              raise SystemExit(f'unexpected Codex host marker at {offset}: {actual!r}')
          data[offset:offset + len(original)] = original
          path.write_bytes(data)
          PY

          echo '1e4addae704bcd703df93fe45057531826382e3033bd9b078b4255c6c2fd345b  .cache/android/reconstructed/package/bin/codex.bin' | sha256sum -c -
          echo '82c2ab9766db335c17debb32cb064bc6928452aff54a9d2e10460f19e25a9beb  .cache/android/reconstructed/package/bin/codex-code-mode-host' | sha256sum -c -
          echo 'd17f227e4df5da1600391338865ce0f3055211760a36688f816941d58232d8dc  .cache/android/reconstructed/package/LICENSE' | sha256sum -c -
          echo 'a8b3a4393683f9e8adbdecbafff07df27e34af020e9e23fed905e9a998b81647  .cache/android/reconstructed/package/NOTICE' | sha256sum -c -

          cat > .cache/android/reconstructed/package/package.json <<'JSON'
          {
            "name": "@mmmbuto/codex-cli-termux",
            "version": "0.153.3-agentcodi.2",
            "description": "AGENTCODI Android ARM64 package based on upstream rust-v0.153.2",
            "license": "Apache-2.0",
            "os": ["android"],
            "cpu": ["arm64"],
            "repository": {
              "url": "git+https://github.com/DioNanos/codex-termux.git"
            }
          }
          JSON

          tar -C .cache/android/reconstructed -czf .cache/android/codex-reconstructed.tgz package
          archive_sha="$(sha256sum .cache/android/codex-reconstructed.tgz | awk '{print $1}')"
          python3 - "$archive_sha" <<'PY'
          from pathlib import Path
          import re, sys
          sha = sys.argv[1]
          path = Path('scripts/build-debug-apk.sh')
          text = path.read_text()
          text, count = re.subn(r'CODEX_ANDROID_SHA256="[0-9a-f]{64}"', f'CODEX_ANDROID_SHA256="{sha}"', text, count=1)
          if count != 1:
              raise SystemExit('could not patch reconstructed Codex archive pin')

          path.write_text(text)
          PY
          echo "AGENTCODI_CODEX_ARCHIVE=/workspace/.cache/android/codex-reconstructed.tgz" >> "$GITHUB_ENV"
          echo "Reconstructed archive SHA-256: $archive_sha"

      - name: Build the container image
        run: docker build --progress=plain -t "$IMAGE" -f .github/ci/Dockerfile .github/ci

      - name: Check the container against the build requirements
        run: |
          docker run --rm $SANDBOX_OPTS \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e AGENTCODI_CODEX_ARCHIVE="$AGENTCODI_CODEX_ARCHIVE" \
            "$IMAGE" .github/ci/container-preflight.sh

      - name: Build the Chinese debug APK
        run: |
          docker run --rm $SANDBOX_OPTS \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e AGENTCODI_CODEX_ARCHIVE="$AGENTCODI_CODEX_ARCHIVE" \
            -e AGENTCODI_CACHE_DIR=/workspace/.cache/android \
            -e AGENTCODI_OUTPUT_DIR=/workspace/output/apk \
            -e AGENTCODI_SKIP_DEVICE_LINKER_TESTS=1 \
            -e AGENTCODI_BOOTSTRAP_LAYOUT=flat \
            "$IMAGE" ./scripts/build-debug-apk.sh

      - name: Hand outputs back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: agentcodi-zh-cn-debug-apk
          path: output/apk/*.apk
          if-no-files-found: error
          retention-days: 7
