name: Recover public Termux inputs

on:
  push:
    branches: [nono1437-zh-cn-build]
    paths: ['.github/workflows/recover-public-inputs.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the original public Termux build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p recovered
          recover() {
            local artifact="$1" name="$2" sha="$3"
            local archive="/tmp/${name}.zip" entry
            curl --fail --location --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -o "$archive" \
              "https://api.github.com/repos/termux/termux-packages/actions/artifacts/$artifact/zip"
            unzip -p "$archive" '*.tar' > "/tmp/${name}.tar"
            entry="$(tar -tf "/tmp/${name}.tar" | awk -v name="$name" '$0 == name || $0 ~ ("/" name "$") {print}')"
            test -n "$entry"
            tar -xOf "/tmp/${name}.tar" "$entry" > "recovered/$name"
            printf '%s  %s\n' "$sha" "recovered/$name" | sha256sum --check
          }
          recover 8567576638 nodejs-lts_24.18.0_aarch64.deb 6456b78aba9e0007de7a4c580d2b34bb3865145bebe06e75273152f8dcba4236
          recover 8746673348 npm_11.19.0_all.deb 385a051111f66c56d0564e6809244f1740427805a78d2e5a5dc470fb420832f8
          recover 8126700666 patchelf_0.19.1_aarch64.deb a08bea49b3c9c3bf449ee0c7b7ee9c97a9f3ab84ae06ace08a564d0903a23c3f

      - name: Inspect the public libc++ 29 archive
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            -o /tmp/libc-archive.json https://archive.org/metadata/termux_pkgs_archive_libc
          python3 - <<'PY'
          import json
          with open('/tmp/libc-archive.json') as stream:
              data = json.load(stream)
          print('Archive servers:', data.get('d1'), data.get('d2'))
          for item in data.get('files', []):
              name = item.get('name', '')
              if '29' in name and ('libc++' in name or 'libc%2B' in name or 'libcxx' in name):
                  print('ARCHIVE FILE', name, item.get('sha256'), item.get('size'))
          PY
          for url in \
            'https://archive.org/download/termux_pkgs_archive_libc/libc++/libc++_29_aarch64.deb' \
            'https://archive.org/download/termux_pkgs_archive_libc/libc%2B%2B/libc%2B%2B_29_aarch64.deb'; do
            if curl --fail --location --silent --show-error --max-time 90 \
                -o recovered/libc++_29_aarch64.deb "$url"; then
              if echo 'bb9f12113c137aa0e8513bb51cc49fe77a5ce3ca39ab9e92c57d228ecdf00222  recovered/libc++_29_aarch64.deb' | sha256sum --check; then
                echo "LIBCXX SOURCE $url"
                break
              fi
            fi
            rm -f recovered/libc++_29_aarch64.deb
          done

      - name: Retain verified packages without printing binary data
        uses: actions/upload-artifact@v4
        with:
          name: recovered-public-termux-inputs
          path: recovered/*.deb
          if-no-files-found: error
          retention-days: 90
