# Hosted test workflow for AGENTCODI.
#
# The local runners (scripts/test.sh, scripts/build-debug-apk.sh) need the
# Termux Android toolchain. This workflow rebuilds the
# portable part of the same test sources with stock Ubuntu tooling instead.
# The drivers live in .github/ci/ and can be run locally as well.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The Java suite creates a file whose name holds an emoji. Under a POSIX locale
# the JVM resolves sun.jnu.encoding to ANSI_X3.4-1968 and cannot encode that
# path at all, so the encoding is pinned rather than inherited.
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture contracts
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report previous CI startup failures
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          for check_id in $(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$PREVIOUS_SHA/check-runs?filter=all&per_page=100" --jq '.check_runs[] | select(.conclusion == "cancelled") | .id'); do
            echo "Startup annotations for previous cancelled check $check_id:"
            gh api --paginate "repos/$GITHUB_REPOSITORY/check-runs/$check_id/annotations" --jq '.[] | .message'
          done
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      # Architecture checks use ripgrep/find and the host Python payload
      # verifier, so they run unchanged on a hosted runner.
      - name: Check architecture contracts
        run: |
          for script in scripts/build-debug-apk.sh scripts/build-release-apk.sh .github/ci/build-release-apk.sh scripts/check-architecture.sh .github/ci/generate-build-inputs.sh .github/ci/fetch-build-inputs.sh .github/ci/verify-build-inputs.sh .github/ci/container-preflight.sh .github/ci/restore-ndk-sysroot.sh; do
            bash -n "$script"
          done
          ./scripts/check-architecture.sh
          diff -u .github/ci/build-inputs.tsv <(.github/ci/generate-build-inputs.sh)
          python3 -B .github/ci/test-release-signing.py
          python3 -B .github/ci/test-build-inputs.py
          python3 -B .github/ci/test-apk-contract.py
          python3 -B .github/ci/test-community-mpl-sources.py

  java:
    name: Java host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Java host tests
        run: .github/ci/run-java-tests.sh

  cpp:
    name: C++ host tests
    # The portable driver builds native fixtures and derives its library path
    # from the compiler; use the ARM64 pool after hosted x64 acquisition failures.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install zlib development headers
        run: |
          if [ ! -e /usr/include/zlib.h ]; then
            sudo apt-get update
            sudo apt-get install -y zlib1g-dev
          fi

      # The supervisor tests spawn and canonicalize /system/bin/sh and use
      # /system/lib64 as the native payload read grant.
      - name: Create the /system shim
        run: .github/ci/setup-system-shim.sh

      - name: Run C++ host tests
        run: .github/ci/run-cpp-tests.sh

  android:
    name: Android sources and resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Android sources and resources
        run: .github/ci/compile-android-sources.sh

  community-codex:
    name: Community Codex release inspection
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check the archive inspection driver
        run: |
          python3 -m py_compile .github/ci/inspect-community-codex.py .github/ci/community-runtime-pins.py .github/ci/verify-community-protocol.py
          python3 .github/ci/test-community-codex-inspection.py

      - name: Download, verify and inspect the pinned Community release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/ci/inspect-community-codex.py \
            --output "$RUNNER_TEMP/community-codex-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload the static inspection report
        uses: actions/upload-artifact@v4
        with:
          name: community-codex-release-inspection
          path: ${{ runner.temp }}/community-codex-${{ github.run_id }}-${{ github.run_attempt }}/report/
          if-no-files-found: error

  community-runtime:
    name: Community ARM64 Bionic runtime
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and prepare APK relocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/ci/inspect-community-codex.py --output "$RUNNER_TEMP/community-runtime"
          python3 .github/ci/community-runtime-pins.py "$RUNNER_TEMP/community-runtime"
          chmod 755 "$RUNNER_TEMP/community-runtime/payload/package/bin/codex.bin" "$RUNNER_TEMP/community-runtime/payload/package/bin/codex-code-mode-host"
          sudo chmod -R a+rX "$RUNNER_TEMP/community-runtime"
          sudo chmod 777 "$RUNNER_TEMP/community-runtime/report"
      - name: Generate schemas using the actual ARM64 Android runtime
        run: |
          docker run --rm --entrypoint /entrypoint.sh \
            -v "$RUNNER_TEMP/community-runtime":/audit \
            termux/termux-docker:aarch64@sha256:e19ea56dd687563849826cbda57da714ae23277ee463e21f39917dbc0a59bab4 \
            bash -c 'set -eu
              mkdir -p /audit/report/schema
              export HOME=/data/data/com.termux/files/usr/tmp/community-home CODEX_HOME=/data/data/com.termux/files/usr/tmp/community-home/codex TMPDIR=/data/data/com.termux/files/usr/tmp
              mkdir -p "$CODEX_HOME"
              /audit/payload/package/bin/codex.bin --version
              /audit/payload/package/bin/codex-code-mode-host --help
              /audit/payload/package/bin/codex.bin app-server generate-json-schema --out /audit/report/schema
              /audit/payload/package/bin/libcodex.so --version'
      - name: Record binary and generated schema pins
        run: python3 .github/ci/community-runtime-pins.py "$RUNNER_TEMP/community-runtime"
      - name: Diagnose isolated code-mode host callbacks
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          python3 .github/ci/probe-code-mode-callbacks.py "$RUNNER_TEMP/community-runtime" || true
          python3 .github/ci/probe-code-mode-callbacks.py "$RUNNER_TEMP/community-runtime" --diagnose
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate generated schemas against client RPCs and the real app-server
        env:
          AGENTCODI_RPC_AUDIT: ${{ runner.temp }}/community-rpc.jsonl
          AGENTCODI_MCP_APPROVAL_AUDIT: ${{ runner.temp }}/community-mcp-approvals.jsonl
        run: |
          .github/ci/run-java-tests.sh
          python3 -m venv "$RUNNER_TEMP/community-validator"
          "$RUNNER_TEMP/community-validator/bin/pip" install --disable-pip-version-check jsonschema==4.26.0
          "$RUNNER_TEMP/community-validator/bin/python" .github/ci/verify-community-protocol.py \
            "$RUNNER_TEMP/community-runtime" --trace "$AGENTCODI_RPC_AUDIT" \
            --mcp-approvals "$AGENTCODI_MCP_APPROVAL_AUDIT"
      - name: Reproduce the original nested MCP callback with a host backtrace
        env:
          AGENTCODI_RPC_AUDIT: ${{ runner.temp }}/community-rpc.jsonl
          AGENTCODI_MCP_APPROVAL_AUDIT: ${{ runner.temp }}/community-mcp-approvals.jsonl
        run: |
          "$RUNNER_TEMP/community-validator/bin/python" -u .github/ci/verify-community-protocol.py \
            "$RUNNER_TEMP/community-runtime" --trace "$AGENTCODI_RPC_AUDIT" \
            --mcp-approvals "$AGENTCODI_MCP_APPROVAL_AUDIT" --nested-mcp --diagnose-gdb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-codex-runtime
          path: ${{ runner.temp }}/community-runtime/report/
          if-no-files-found: error

  package-build-contract:
    name: Package recipe and toolchain contracts
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install recipe metadata reader
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      - name: Check pinned source, edition overlay and ARM64 package paths
        env:
          AGENTCODI_PACKAGE_REPORT: ${{ runner.temp }}/package-contract-report
        run: |
          bash -n .github/ci/check-package-edition.sh scripts/package-edition/check-toolchain.sh scripts/package-edition/build-apt-repository.sh scripts/package-edition/check-apt-repository.sh scripts/package-edition/check-apt-signing.sh .github/ci/catalog-smoke.sh .github/ci/apt-repository-smoke.sh
          python3 -m py_compile scripts/package-edition/patch-npm-bins.py scripts/package-edition/source-store.py scripts/package-edition/download-sources.py scripts/package-edition/apt-repository.py .github/ci/create-apt-fixtures.py .github/ci/serve-apt-repository.py .github/ci/check-published-apt.py
          python3 -B .github/ci/test-bootstrap-assembly.py
          python3 -B .github/ci/test-catalog-sources.py
          python3 -B .github/ci/test-source-store.py
          .github/ci/check-package-edition.sh
      - name: Upload package build contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-build-contract
          path: ${{ runner.temp }}/package-contract-report/
          if-no-files-found: error
