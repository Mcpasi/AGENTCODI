name: Transfer Package Edition build-input token
on:
  push:
    branches: ['Mcpasi/transfer-package-signing-secrets']
    paths:
      - '.github/workflows/transfer-package-build-input-token.yml'
      - '.github/ci/transfer-package-build-input-token.py'
      - '.github/ci/test-transfer-package-build-input-token.py'

permissions: {}
concurrency:
  group: transfer-build-input-token-to-Mcpasi-AGENTCODI-Package-Edition
  cancel-in-progress: false

jobs:
  transfer:
    name: Copy and validate the private build-input read token
    if: github.repository == 'Mcpasi/AGENTCODI' && github.ref == 'refs/heads/Mcpasi/transfer-package-signing-secrets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check transfer-token access before exposing the mirror token
        env:
          GH_TOKEN: ${{ secrets.AGENTCODI_SECRET_TRANSFER_TOKEN }}
        run: python3 -B .github/ci/transfer-package-signing-secrets.py --preflight
      - name: Install pinned encryption dependencies without the mirror token
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/agentcodi-input-token-transfer"
          "$RUNNER_TEMP/agentcodi-input-token-transfer/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r .github/ci/transfer-package-signing-requirements.txt
      - name: Check the one-token transfer with synthetic values
        run: '"$RUNNER_TEMP/agentcodi-input-token-transfer/bin/python" -B .github/ci/test-transfer-package-build-input-token.py'
      - name: Validate mirror access and encrypt the existing read token
        env:
          GH_TOKEN: ${{ secrets.AGENTCODI_SECRET_TRANSFER_TOKEN }}
          AGENTCODI_INPUTS_TOKEN: ${{ secrets.AGENTCODI_INPUTS_TOKEN }}
        run: '"$RUNNER_TEMP/agentcodi-input-token-transfer/bin/python" -B .github/ci/transfer-package-build-input-token.py'
