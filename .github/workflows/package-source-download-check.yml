name: Package source archive checks
on:
  push:
    branches: ['Mcpasi/package-edition']
    paths: ['.github/workflows/package-source-download-check.yml', 'third_party/package-source-archives/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/Mcpasi/package-edition'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged source hashes and original legal material
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import tarfile
          root = Path("third_party/package-source-archives")
          provenance = json.loads((root / "PROVENANCE.json").read_text())
          expected = {
              "attr-2.6.0.tar.gz": "d42fa374513180bb48cb11a46696f488240e5124ff1e6ad88b0abff706985612",
              "acl-2.4.0.tar.gz": "73c853c3d44e1f693e5a96a986f1bd19d3d0dac2c7d453e796177774bc4e5f6a",
          }
          if provenance["format_version"] != 1 or set(provenance["sources"]) != set(expected):
              raise SystemExit("Source provenance file set differs")
          for name, digest in expected.items():
              path = root / name
              record = provenance["sources"][name]
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest or record["sha256"] != digest or path.stat().st_size != record["size"]:
                  raise SystemExit("Original pinned source bytes differ: " + name)
              with tarfile.open(path, "r:gz") as archive:
                  legal = [item.name for item in archive if item.isfile() and
                           Path(item.name).name.upper().startswith(("COPYING", "LICENSE", "LICENCE"))]
              if not legal:
                  raise SystemExit("Original source legal material missing")
              print(json.dumps({"file": name, "sha256": digest, "legal_files": legal}))
          PY
